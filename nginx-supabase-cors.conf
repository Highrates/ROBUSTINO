# Вставки для /etc/nginx/sites-available/default на сервере
# Цель: CORS для localhost + прод, лимит загрузки 50M для 3D моделей

# ========== 1. В НАЧАЛО ФАЙЛА (после комментариев, перед первым "server {") ==========
# Добавьте этот блок один раз:

map $http_origin $cors_origin {
    default "";
    "https://robustino.ru" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:3001" $http_origin;
}

# ========== 2. В КАЖДЫЙ "location /supabase-api/ {" (их два: default_server и robustino.ru) ==========
# Замените блок на этот (добавлены client_max_body_size, CORS и OPTIONS):

        location /supabase-api/ {
                client_max_body_size 50M;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, accept-profile, content-profile" always;
                add_header Access-Control-Allow-Credentials "true" always;

                if ($request_method = OPTIONS) {
                        return 204;
                }

                rewrite ^/supabase-api/(.*) /$1 break;
                proxy_pass http://127.0.0.1:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_read_timeout 86400;
        }

# После правок на сервере:
#   sudo nginx -t && sudo systemctl reload nginx
